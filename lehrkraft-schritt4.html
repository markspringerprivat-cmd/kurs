<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lehrkraft · Schritt 4</title>
  <link rel="stylesheet" href="style.css?v=10" />
  <script src="script.js?v=10" defer></script>
</head>
<body data-page="role-step" data-role="lehrkraft" data-step="4">
  <header class="role-header topbar utility-topbar" aria-label="Seitenaktionen">
    <div class="top-actions">
      <a class="button subtle small" href="index.html">Zurück zur Hauptseite</a>
      <button class="reset-button" type="button" data-reset>Webseite zurücksetzen</button>
    </div>
  </header>

  <main class="role-main step-main">
    <article class="role-page-card step-card conversation-card">
      <section class="step-title-bar teacher">
        <p class="eyebrow">Schritt 4</p>
        <h1>Gespräch durchführen</h1>
        <p>Nutze deine vorbereiteten Gedanken und Gesprächsimpulse während des Rollenspiels.</p>
      </section>
      <section class="conversation-grid">
        <div class="review-card">
          <p class="eyebrow">Vorbereitung</p>
          <h2>Meine Gedanken</h2>
          <div class="saved-preview" data-display-from="prep-lehrkraft">Noch keine Gedanken gespeichert.</div>
        </div>
        <div class="list-card">
          <p class="eyebrow">Gespräch</p>
          <h2>Fragen und Sätze</h2>
          <div class="saved-list" data-list-display="statements-lehrkraft"></div>
        </div>
        <label class="input-card full-width">
          <span>Notizen während des Gesprächs</span>
          <small class="field-help">Beispiele: Welche Aussage war hilfreich? Wo wurde es schwierig? Was möchtest du später reflektieren?</small>
          <textarea data-save-key="conversation-notes-lehrkraft" placeholder="Was passiert im Gespräch? Welche Aussagen funktionieren gut? Wo entsteht Spannung?"></textarea>
        </label>
      </section>
      <div class="step-navigation split"><a class="button subtle" href="lehrkraft-schritt3.html">Zurück zu Schritt 3</a><a class="button primary" href="reflexion.html">Zum Reflexionsbogen</a></div>
    </article>
  </main>
</body>
</html>
