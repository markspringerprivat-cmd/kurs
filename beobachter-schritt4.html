<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Beobachter/in · Schritt 4</title>
  <link rel="stylesheet" href="style.css?v=9" />
  <script src="script.js?v=9" defer></script>
</head>
<body data-page="role-step" data-role="beobachter" data-step="4">
  <header class="role-header topbar utility-topbar" aria-label="Seitenaktionen">
    <div class="top-actions">
      <a class="button subtle small" href="rollenkarten.html">Zurück</a>
      <button class="reset-button" type="button" data-reset>Webseite zurücksetzen</button>
    </div>
  </header>

  <main class="role-main step-main">
    <article class="role-page-card step-card conversation-card">
      <section class="step-title-bar observer">
        <p class="eyebrow">Schritt 4</p>
        <h1>Gespräch beobachten</h1>
        <p>Nutze deine Beobachtungsfragen und halte während des Gesprächs konkrete Beispiele fest.</p>
      </section>
      <section class="conversation-grid">
        <div class="review-card"><p class="eyebrow">Vorbereitung</p><h2>Mein Beobachtungsfokus</h2><div class="saved-preview" data-display-from="prep-beobachter">Noch kein Beobachtungsfokus gespeichert.</div></div>
        <div class="list-card"><p class="eyebrow">Beobachtung</p><h2>Meine Beobachtungsfragen</h2><div class="saved-list" data-list-display="statements-beobachter"></div></div>
        <label class="input-card"><span>Beziehungsfördernde Aussagen oder Verhaltensweisen</span><textarea data-save-key="observer-positive" placeholder="Welche Aussagen, Fragen oder Verhaltensweisen haben beruhigt oder Verständnis gezeigt?"></textarea></label>
        <label class="input-card"><span>Konfliktverschärfende Aussagen oder Verhaltensweisen</span><textarea data-save-key="observer-negative" placeholder="Welche Aussagen, Reaktionen oder Verhaltensweisen haben Spannung erzeugt?"></textarea></label>
        <label class="input-card full-width"><span>Weitere Beobachtungsnotizen</span><textarea data-save-key="conversation-notes-beobachter" placeholder="Konkrete Beispiele, Wendepunkte, auffällige Körpersprache oder wichtige Gesprächsstellen notieren."></textarea></label>
      </section>
      <div class="step-navigation split"><a class="button subtle" href="beobachter-schritt3.html">Zurück zu Schritt 3</a><a class="button primary" href="reflexion.html">Zum Reflexionsbogen</a></div>
    </article>
  </main>
</body>
</html>
